<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlorandoSur — Crear Cuenta</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card fade-up">

    <img src="../logo.png" alt="FlorandoSur" class="login-logo-img" />
    <p class="login-subtitle">Crear cuenta</p>

    <div id="signup-error" class="login-error"></div>

    <div class="form-group">
      <label class="form-label" for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        class="form-control"
        placeholder="tu@correo.com"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        class="form-control"
        placeholder="••••••••"
        autocomplete="new-password"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="password-confirm">Confirmar Contraseña</label>
      <input
        id="password-confirm"
        type="password"
        class="form-control"
        placeholder="••••••••"
        autocomplete="new-password"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Tipo de usuario</label>
      <div style="display:flex; gap:16px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1;">
          <input type="radio" name="user-type" value="delivery" checked id="role-delivery" style="cursor:pointer; width:18px; height:18px; accent-color:var(--accent);" />
          <span style="font-size:14px;">Delivery</span>
        </label>
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1;">
          <input type="radio" name="user-type" value="admin" id="role-admin" style="cursor:pointer; width:18px; height:18px; accent-color:var(--accent);" />
          <span style="font-size:14px;">Admin</span>
        </label>
      </div>
    </div>

    <button id="btn-signup" class="btn btn-primary w-full" style="margin-top:8px; justify-content:center; height:42px;">
      Crear cuenta
    </button>

    <p style="text-align:center; margin-top:24px; font-size:13px; color:var(--text-muted);">
      ¿Ya tienes cuenta? <a href="../index.html" class="login-link" style="color:var(--accent);">Ingresar</a>
    </p>

  </div>
</div>

<script type="module">
  import { supabase } from '../js/supabase.js'

  const btnSignup = document.getElementById('btn-signup')
  const emailInput = document.getElementById('email')
  const passInput = document.getElementById('password')
  const passConfirmInput = document.getElementById('password-confirm')
  const errorBox = document.getElementById('signup-error')

  // Manejar callback de confirmación de email
  window.addEventListener('load', async () => {
    const hash = window.location.hash
    if (hash.includes('type=email_confirmation')) {
      // Supabase ya procesó el token automáticamente
      // Mostrar mensaje de confirmación completada
      mostrarConfirmacionCompletada()
      return
    }
  })

  // Si ya está logueado, redirigir
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      const rol = session.user?.user_metadata?.rol || 'delivery'
      if (rol === 'delivery') {
        window.location.href = 'pages/pedidos.html'
      } else {
        window.location.href = 'pages/dashboard.html'
      }
    }
  }).catch(err => {
    console.error('Error verificando sesión:', err)
  })

  btnSignup.addEventListener('click', async () => {
    const email = emailInput.value.trim()
    const password = passInput.value
    const passwordConfirm = passConfirmInput.value
    const rol = document.querySelector('input[name="user-type"]:checked').value

    // Validaciones
    if (!email || !password || !passwordConfirm) {
      mostrarError('Por favor completá todos los campos.')
      return
    }

    if (!email.includes('@')) {
      mostrarError('Por favor ingresá un email válido.')
      return
    }

    if (password.length < 6) {
      mostrarError('La contraseña debe tener al menos 6 caracteres.')
      return
    }

    if (password !== passwordConfirm) {
      mostrarError('Las contraseñas no coinciden.')
      return
    }

    btnSignup.textContent = 'Creando cuenta...'
    btnSignup.disabled = true
    errorBox.style.display = 'none'

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: {
          rol: rol, // Usar rol seleccionado en el formulario
          nombre: email.split('@')[0], // Nombre basado en email
        }
      }
    })

    if (error) {
      mostrarError(error.message || 'Error al crear la cuenta.')
      btnSignup.textContent = 'Crear cuenta'
      btnSignup.disabled = false
      return
    }
    // Guardar el rol en la tabla profiles
    if (data.user) {
      const { error: profileError } = await supabase
        .from('profiles')
        .insert([{
          id: data.user.id,
          rol: rol,
          nombre: email.split('@')[0]
        }])
      
      if (profileError) {
        console.error('Error guardando perfil:', profileError)
      }
    }
    // Si la cuenta se creó exitosamente
    mostrarConfirmacion(email)
  })

  // Enter para signup
  passConfirmInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') btnSignup.click()
  })

  function mostrarError(msg) {
    errorBox.textContent = msg
    errorBox.style.display = 'block'
  }

  function mostrarConfirmacion(email) {
    // Ocultar formulario
    document.querySelectorAll('.form-group').forEach(el => el.style.display = 'none')
    document.getElementById('btn-signup').style.display = 'none'

    // Actualizar UI
    const subtitle = document.querySelector('.login-subtitle')
    subtitle.textContent = 'Confirma tu email'

    // Mostrar mensaje de confirmación
    errorBox.style.color = 'var(--success)'
    errorBox.style.background = 'var(--success-light)'
    errorBox.innerHTML = `
      <div style="text-align:center; padding:20px 0;">
        <div style="font-size:48px; margin-bottom:12px;">✓</div>
        <div style="font-size:16px; font-weight:500; margin-bottom:8px;">¡Cuenta creada!</div>
        <div style="font-size:14px; margin-bottom:16px;">Enviamos un email de confirmación a:</div>
        <div style="font-size:14px; font-weight:500; color:var(--text-primary); margin-bottom:20px;">${email}</div>
        <div style="font-size:13px; line-height:1.6;">
          Hacé click en el enlace del email para confirmar tu cuenta.<br/>
          Luego podés ingresar con tus credenciales.
        </div>
      </div>
    `
    errorBox.style.display = 'block'

    // Agregar botón de volver
    const backLink = document.createElement('p')
    backLink.style.cssText = 'text-align:center; margin-top:24px; font-size:13px; color:var(--text-muted);'
    backLink.innerHTML = '<a href="../index.html" class="login-link" style="color:var(--accent);">Volver al login</a>'
    errorBox.parentElement.appendChild(backLink)
  }

  function mostrarConfirmacionCompletada() {
    // Ocultar formulario
    document.querySelectorAll('.form-group').forEach(el => el.style.display = 'none')
    document.getElementById('btn-signup').style.display = 'none'

    // Actualizar UI
    const subtitle = document.querySelector('.login-subtitle')
    subtitle.textContent = 'Email confirmado'

    // Mostrar mensaje de éxito
    errorBox.style.color = 'var(--success)'
    errorBox.style.background = 'var(--success-light)'
    errorBox.innerHTML = `
      <div style="text-align:center; padding:20px 0;">
        <div style="font-size:48px; margin-bottom:12px;">✓✓</div>
        <div style="font-size:16px; font-weight:500; margin-bottom:8px;">¡Email confirmed!</div>
        <div style="font-size:14px; margin-bottom:20px;">Tu cuenta está lista para usar.</div>
        <div style="font-size:13px; line-height:1.6;">
          Redirigiendo al login en 3 segundos...<br/>
          Si no te redirige, <a href="../index.html" class="login-link" style="color:var(--accent);">haz click aquí</a>
        </div>
      </div>
    `
    errorBox.style.display = 'block'

    // Redirigir al login en 3 segundos
    setTimeout(() => {
      window.location.href = '../index.html'
    }, 3000)
  }
</script>

</body>
</html>
