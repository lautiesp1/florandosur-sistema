<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlorandoSur — Pedidos</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">

  <div style="display:flex; flex-direction:column; overflow:hidden;">

    <header class="topbar">
      <span class="page-title" id="page-title">Pedidos</span>
      <div class="topbar-actions" id="topbar-actions">
        <!-- Se llena según rol -->
      </div>
    </header>

    <main class="main-content fade-up">

      <!-- Filtros de estado (solo admin) -->
      <div id="filtros-estado" style="display:flex; gap:8px; margin-bottom:20px; display:none;">
        <button class="btn btn-ghost btn-sm filtro active" data-estado="todos">Todos</button>
        <button class="btn btn-ghost btn-sm filtro" data-estado="pendiente">Pendientes</button>
        <button class="btn btn-ghost btn-sm filtro" data-estado="en_camino">En camino</button>
        <button class="btn btn-ghost btn-sm filtro" data-estado="entregado">Entregados</button>
      </div>

      <!-- Panel Juan: aviso de rol -->
      <div id="aviso-delivery" style="
        display:none;
        background:var(--accent-light);
        border:1px solid var(--accent);
        border-radius:var(--radius-lg);
        padding:14px 18px;
        margin-bottom:20px;
        font-size:13.5px;
        color:var(--accent);
      ">
        <strong>Hola Juan.</strong> Acá aparecen tus pedidos del día. Actualizá el estado cuando salgas a entregar.
      </div>

      <!-- Tabla -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr id="tabla-headers">
              <!-- se llena según rol -->
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="6" style="text-align:center; padding:32px; color:var(--text-muted);">Cargando...</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- Modal: nuevo pedido (solo admin) -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:700px; max-height:90vh; overflow-y:auto;">
    <div class="modal-header">
      <span class="modal-title">Nuevo pedido</span>
      <button class="btn-icon" id="btn-cerrar-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Cliente *</label>
        <select id="f-cliente" class="form-control">
          <option value="">Seleccioná un cliente...</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Dirección de entrega *</label>
        <input id="f-direccion" class="form-control" type="text" placeholder="" />
      </div>

      <div class="form-group">
        <label class="form-label">Teléfono de entrega (opcional)</label>
        <input id="f-telefono" class="form-control" type="tel" placeholder="" />
      </div>

      <div class="form-group">
        <label class="form-label">Productos *</label>
        <div style="margin-bottom:12px;">
          <input id="f-buscar-producto" class="form-control" type="text" placeholder="" />
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
          <div>
            <div style="font-size:12px; font-weight:500; margin-bottom:8px; color:var(--text-muted);">Disponibles</div>
            <div id="productos-disponibles" style="border:1px solid var(--border); border-radius:var(--radius); padding:8px; min-height:200px; max-height:300px; overflow-y:auto; background:var(--bg);">
              <!-- Se llena dinamicamente -->
            </div>
          </div>
          <div>
            <div style="font-size:12px; font-weight:500; margin-bottom:8px; color:var(--text-muted);">Seleccionados</div>
            <div id="productos-seleccionados" style="border:2px dashed var(--accent-light); border-radius:var(--radius); padding:8px; min-height:200px; max-height:300px; overflow-y:auto; background:var(--accent-light);">
              <div style="text-align:center; color:var(--text-muted); font-size:12px; padding:24px;">
                Haz clic en un producto para agregarlo
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Notas para el delivery (opcional)</label>
        <input id="f-notas" class="form-control" type="text" placeholder="" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancelar">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar">Crear pedido</button>
    </div>
  </div>
</div>
<div id="modal-detalle-pedido" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:500px;">
    <div class="modal-header">
      <span class="modal-title">Detalle completo del pedido</span>
      <button class="btn-icon" onclick="cerrarModalDetalle()">✕</button>
    </div>
    <div class="modal-body" id="detalle-pedido-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModalDetalle()">Cerrar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
  import { supabase, requiereAuth, getRol, toast, confirmar } from '../js/supabase.js';
  import { renderSidebar } from '../js/sidebar.js';

  const user = await requiereAuth()
  const rol = await getRol()
  renderSidebar('pedidos', user)

  let pedidos  = []
  let clientes = []
  let productos = []
  let filtroActivo = 'todos'
  let productosSeleccionados = []

  const esAdmin = rol === 'admin'

  // ── Configurar UI según rol ───────────────────────

  if (esAdmin) {
    document.getElementById('page-title').textContent = 'Pedidos de delivery'
    document.getElementById('topbar-actions').innerHTML = `
      <button class="btn btn-primary" id="btn-nuevo">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo pedido
      </button>
    `
    document.getElementById('filtros-estado').style.display = 'flex'
    document.getElementById('tabla-headers').innerHTML = `
      <th>Cliente</th>
      <th>Dirección</th>
      <th>Productos</th> 
      <th>Notas</th>
      <th>Estado</th>
      <th>Fecha</th>
      <th style="width:100px;"></th>`

    document.getElementById('btn-nuevo')?.addEventListener('click', () => abrirModal())
  } else {
    // Juan
    document.getElementById('page-title').textContent = 'Mis pedidos'
    document.getElementById('topbar-actions').innerHTML = '' // <--- Esto elimina cualquier botón residual
    document.getElementById('aviso-delivery').style.display = 'block'
    document.getElementById('tabla-headers').innerHTML = `
      <th>Cliente</th>
      <th>Dirección</th>
      <th>Productos</th>
      <th>Notas</th>
      <th>Estado</th>
      <th>Acción</th>`;
  }

  // ── Cargar ────────────────────────────────────────

  async function cargar() {
    let query = supabase
      .from('pedidos')
      // 👇 Aquí descargamos todo: total, descuentos y productos
      .select('id, cliente_id, estado, direccion_entrega, telefono_entrega, total, descuento, tipo_descuento, productos_json, notas, metodo_pago, created_at, clientes(nombre, telefono)')
      .order('created_at', { ascending: false })

    if (!esAdmin) {
      query = query.in('estado', ['pendiente', 'en_camino'])
    }

    const { data, error } = await query
    if (error) { toast('Error al cargar pedidos.', 'error'); return }
    pedidos = data
    renderTabla()

    // 👇 AQUÍ IMPLEMENTAMOS LA LECTURA ULTRARRÁPIDA
    if (esAdmin) {
      // Cargar clientes desde Caché o Supabase
      let c = JSON.parse(sessionStorage.getItem('cache_clientes'));
      if (!c) {
        const { data: dataC } = await supabase.from('clientes').select('id, nombre').order('nombre')
        c = dataC ?? [];
        sessionStorage.setItem('cache_clientes', JSON.stringify(c));
      }
      clientes = c;
      poblarSelectClientes()

      // Cargar productos desde Caché o Supabase
      let p = JSON.parse(sessionStorage.getItem('cache_productos'));
      if (!p) {
        const { data: dataP } = await supabase.from('productos').select('*').order('nombre')
        p = dataP ?? [];
        sessionStorage.setItem('cache_productos', JSON.stringify(p));
      }
      productos = p;
    }
  }

  function renderTabla() {
    const tbody = document.getElementById('tabla-body')
    let lista = pedidos

    if (esAdmin && filtroActivo !== 'todos') {
      lista = pedidos.filter(p => p.estado === filtroActivo)
    }

    if (!lista || lista.length === 0) {
      tbody.innerHTML = `
        <tr><td colspan="${esAdmin ? 7 : 6}">
          <div class="empty-state">
            <div class="empty-state-icon">🛵</div>
            <div class="empty-state-title">Sin pedidos${!esAdmin ? ' pendientes' : ''}</div>
            <div class="empty-state-sub">${esAdmin ? 'Creá el primer pedido con el botón de arriba.' : 'Cuando tengas pedidos asignados aparecerán acá.'}</div>
          </div>
        </td></tr>`
      return
    }

    const estadoBadge = {
      pendiente: '<span class="badge badge-yellow">Pendiente</span>',
      en_camino: '<span class="badge badge-green">En camino</span>',
      entregado: '<span class="badge badge-gray">Entregado</span>',
    }

    tbody.innerHTML = lista.map(p => {
      const fecha = new Date(p.created_at).toLocaleDateString('es-AR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })
      
      // Número verde para WhatsApp (funciona para Admin y Delivery)
      const telefono = p.clientes?.telefono || p.telefono_entrega || '';
      const telLimpio = telefono.replace(/\D/g, '');
      const linkWA = telLimpio 
        ? `<div style="margin-top:4px;"><a href="https://wa.me/54${telLimpio}" target="_blank" style="font-size:12px; color:#25D366; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">📱 ${telefono}</a></div>` 
        : '';

      // Botón "Ver detalle" (Ya no dice más 'Sin productos')
      const btnVerDetalle = `<button class="btn btn-ghost btn-sm" onclick="verDetallePedido('${p.id}')" style="border-color:var(--accent); color:var(--accent);">👁️ Ver detalle</button>`;

      if (esAdmin) {
        // Vista Administrador (7 columnas exactas)
        return `
          <tr>
            <td>
              <div style="font-weight:600;">${p.clientes?.nombre || 'S/N'}</div>
              ${linkWA}
            </td>
            <td style="font-size:13px;">${p.direccion_entrega || '—'}</td>
            <td>${btnVerDetalle}</td>
            <td class="td-muted" style="font-size:12px; font-style:italic; max-width:160px;">${p.notas || '—'}</td>
            <td>
              <select class="form-control" style="font-size:12px; padding:4px 8px; width:auto; margin-bottom:4px;"
                onchange="cambiarEstado('${p.id}', this.value)">
                <option value="pendiente" ${p.estado==='pendiente'?'selected':''}>Pendiente</option>
                <option value="en_camino" ${p.estado==='en_camino'?'selected':''}>En camino</option>
                <option value="entregado" ${p.estado==='entregado'?'selected':''}>Entregado</option>
              </select>
            </td>
            <td class="td-muted" style="white-space:nowrap; font-size:12px;">${fecha}</td>
            <td>
              <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn-icon" title="Editar pedido" onclick="editarPedido('${p.id}')" style="font-size:16px;">✏️</button>
                <button class="btn-icon" title="Eliminar pedido" onclick="eliminarPedido('${p.id}')" style="font-size:16px; color:var(--danger);">🗑️</button>
              </div>
            </td>
          </tr>`
      } else {
        // Vista de Delivery (6 columnas exactas)
        let accionBtn = ''
        if (p.estado === 'pendiente') {
          accionBtn = `<button class="btn btn-primary btn-sm" onclick="cambiarEstado('${p.id}','en_camino')">Salir a entregar</button>`
        } else if (p.estado === 'en_camino') {
          accionBtn = `<button class="btn btn-ghost btn-sm" style="border-color:var(--success); color:var(--success);" onclick="cambiarEstado('${p.id}','entregado')">Marcar entregado</button>`
        }

        return `
          <tr>
            <td>
              <div style="font-weight:500;">${p.clientes?.nombre ?? '—'}</div>
              ${linkWA}
            </td>
            <td style="font-size:13px;">${p.direccion_entrega ?? '—'}</td>
            <td>${btnVerDetalle}</td>
            <td class="td-muted" style="font-size:12px; font-style:italic;">${p.notas ?? '—'}</td>
            <td>${estadoBadge[p.estado] ?? p.estado}</td>
            <td>${accionBtn}</td>
          </tr>`
      }
    }).join('')
  }

  // ── Filtros ───────────────────────────────────────

  document.querySelectorAll('.filtro').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      filtroActivo = btn.dataset.estado
      renderTabla()
    })
  })

  // ── Cambiar estado ────────────────────────────────

  window.cambiarEstado = async (id, nuevoEstado) => {
    const { error } = await supabase
      .from('pedidos')
      .update({ estado: nuevoEstado })
      .eq('id', id)

    if (error) { toast('Error al actualizar estado.', 'error'); return }

    const msgs = {
      pendiente: 'Pedido marcado como pendiente',
      en_camino: '¡En camino! 🛵',
      entregado: 'Pedido entregado ✓'
    }
    toast(msgs[nuevoEstado] ?? 'Estado actualizado', 'success')
    await cargar()
  }

  // ── Validar teléfono: solo números y + ──────────
  const setupPhoneValidation = () => {
    const telInput = document.getElementById('f-telefono')
    if (telInput) {
      telInput.addEventListener('input', (e) => {
        let value = e.target.value
        // Mantener solo números y +
        value = value.replace(/[^\d+]/g, '')
        // Máximo 20 caracteres
        value = value.substring(0, 20)
        e.target.value = value
      })
    }
  }

  // Validar teléfono antes de enviar
  const validarTelefono = (tel) => {
    if (!tel) return true // opcional
    return /^[\d\s+]+$/.test(tel) && tel.length >= 6
  }

  // Llamar al cargar para validar el teléfono
  setupPhoneValidation()

  function cerrarModal() {
    document.getElementById('modal-overlay').style.display = 'none'
  }

  document.getElementById('btn-cerrar-modal').addEventListener('click', cerrarModal)
  document.getElementById('btn-cancelar').addEventListener('click', cerrarModal)
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') cerrarModal()
  })

  function poblarSelectClientes() {
    const sel = document.getElementById('f-cliente')
    sel.innerHTML = '<option value="">Seleccioná un cliente...</option>' +
      clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')
  }

  // ── Productos: Sistema de clic y búsqueda ────────

  function renderProductosDisponibles(lista = productos) {
    const container = document.getElementById('productos-disponibles')
    if (!lista || lista.length === 0) {
        container.innerHTML = '<div class="empty-state">Sin productos</div>'
      return
    }

    container.innerHTML = lista.map(p => {
      // Combinamos cantidad y unidad de forma inteligente (ej: "60 ml" o "1 unidad")
      const contenido = (p.cantidad && p.unidad) ? `${p.cantidad} ${p.unidad}` : (p.unidad || 'unidad');
      return `
        <div onclick="agregarProductoAlPedido('${p.id}')" class="item-disponible" style="
          padding:10px; margin-bottom:8px; background:var(--surface); 
          border:1px solid var(--border); border-radius:6px; cursor:pointer;">
          <div style="font-weight:600; font-size:13px;">${p.nombre}</div>
          <div style="display:flex; justify-content:space-between; margin-top:5px; font-size:11px; color:var(--text-muted);">
            <span>Stock: <strong>${p.stock}</strong></span>
            <span>Medida: <strong>${contenido}</strong></span>
          </div>
          <div style="color:var(--accent); font-weight:600; margin-top:5px;">$${Number(p.precio_venta).toLocaleString('es-AR')}</div>
        </div>
      `
    }).join('')
  }

  function renderProductosSeleccionados() {
    const container = document.getElementById('productos-seleccionados')
    if (productosSeleccionados.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:12px; padding:24px;">Haz clic en un producto para agregarlo</div>'
      return
    }

    container.innerHTML = productosSeleccionados.map((p, idx) => {
      // ✅ Buscamos el stock actualizado por si en el JSON venía undefined
      const prodFresco = productos.find(prod => prod.id === p.id);
      const stockReal = prodFresco ? prodFresco.stock : (p.stock ?? '-');
      const contenido = p.contenido || p.unidad || (prodFresco ? prodFresco.unidad : 'unidad');

      return `
      <div style="padding:10px; margin:6px 0; background:var(--surface); border:1px solid var(--accent); border-radius:6px; font-size:13px;">
        <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:8px;">
          <div style="font-weight:600; flex:1; color:var(--text-primary);">${p.nombre}</div>
          <button onclick="quitarProductoSeleccionado(${idx})" style="background:none; border:none; cursor:pointer; color:var(--danger); font-size:18px; padding:0 4px;">×</button>
        </div>
        
        <div style="display:flex; gap:12px; color:var(--text-muted); font-size:11px; margin-bottom:10px; background:var(--bg); padding:6px; border-radius:4px;">
          <span>📦 Stock: <strong style="color:var(--text-primary)">${stockReal}</strong></span>
          <span>📏 Contenido: <strong style="color:var(--text-primary)">${contenido}</strong></span>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <label style="font-size:12px; color:var(--text-muted);">Cantidad a pedir:</label>
          <input type="number" min="1" max="${stockReal !== '-' ? stockReal : 999}" value="${p.cantidadPedida || 1}" onchange="actualizarCantidadProducto(${idx}, this.value)" class="form-control" style="padding:4px 8px; font-size:13px; width:70px; height:30px;" />
        </div>
      </div>
    `}).join('')
  }

  window.agregarProductoAlPedido = (productoId) => {
    const producto = productos.find(p => p.id === productoId)
    if (!producto) return

    const yaSeleccionado = productosSeleccionados.find(p => p.id === productoId)
    if (!yaSeleccionado) {
      productosSeleccionados.push({
        id: producto.id,
        nombre: producto.nombre,
        genetica: producto.genetica ? producto.genetica.join(', ') : null,
        sabor: producto.sabor ? producto.sabor.join(', ') : null,
        unidad: producto.unidad || 'unidad',
        cantidadPedida: 1,
        stock: producto.stock
      })
      renderProductosSeleccionados()
    }
  }

  window.actualizarCantidadProducto = (idx, cantidad) => {
    const num = parseInt(cantidad) || 1
    if (num > 0) {
      productosSeleccionados[idx].cantidadPedida = num
    }
  }

  window.actualizarUnidadProducto = (idx, unidad) => {
    productosSeleccionados[idx].unidad = unidad
  }

  window.quitarProductoSeleccionado = (idx) => {
    productosSeleccionados.splice(idx, 1)
    renderProductosSeleccionados()
  }

  // ── Buscador de productos ────────────────────────
  document.getElementById('f-buscar-producto')?.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase()
    const filtrados = query ? productos.filter(p => p.nombre.toLowerCase().includes(query)) : productos
    renderProductosDisponibles(filtrados)
  })

  // ── Abrir modal (Nuevo Pedido) ──────────────────────────────────
  function abrirModal() {
    document.getElementById('modal-overlay').dataset.editingId = '' // Limpiar ID por las dudas
    productosSeleccionados = []
    document.getElementById('f-cliente').value = ''
    document.getElementById('f-direccion').value = ''
    document.getElementById('f-telefono').value = ''
    document.getElementById('f-notas').value = ''
    document.getElementById('f-buscar-producto').value = ''
    
    // Restauramos textos
    document.getElementById('btn-guardar').textContent = 'Crear pedido'
    document.querySelector('.modal-title').textContent = 'Nuevo pedido'

    renderProductosDisponibles()
    renderProductosSeleccionados()
    document.getElementById('modal-overlay').style.display = 'flex'
    document.getElementById('f-cliente').focus()
  }

  document.getElementById('btn-guardar').addEventListener('click', async () => {
    const clienteId = document.getElementById('f-cliente').value
    const direccion = document.getElementById('f-direccion').value.trim()
    const telefono = document.getElementById('f-telefono').value.trim()
    const notas = document.getElementById('f-notas').value.trim()

    if (!clienteId) { toast('Seleccioná un cliente.', 'error'); return }
    if (!direccion) { toast('Ingresá la dirección de entrega.', 'error'); return }
    if (productosSeleccionados.length === 0) { toast('Agregá al menos un producto.', 'error'); return }
    if (telefono && !validarTelefono(telefono)) { toast('Teléfono inválido. Usa números, + y espacios.', 'error'); return }

    const btn = document.getElementById('btn-guardar')
    btn.textContent = 'Creando...'
    btn.disabled = true

    // Calcular el total del pedido usando los precios de los productos seleccionados
    const totalPedido = productosSeleccionados.reduce((acc, item) => {
        const productoOriginal = productos.find(p => p.id === item.id)
        const precio = productoOriginal ? (productoOriginal.precio_venta || 0) : 0
        return acc + (precio * item.cantidadPedida)
    }, 0)

    const editingId = document.getElementById('modal-overlay').dataset.editingId
    const payload = {
      cliente_id: clienteId,
      direccion_entrega: direccion,
      telefono_entrega: telefono || null,
      notas: notas || null,
      productos_json: productosSeleccionados.length > 0 ? productosSeleccionados : null
    }

    let error;
    if (editingId) {
      ({ error } = await supabase.from('pedidos').update(payload).eq('id', editingId));
    } else {
      payload.estado = 'pendiente';
      ({ error } = await supabase.from('pedidos').insert(payload));
    }

    btn.textContent = 'Crear pedido'
    btn.disabled = false

    if (error) { 
      console.error('Error INSERT:', error)
      toast('Error al crear el pedido: ' + (error.message || 'Error desconocido'), 'error'); 
      return 
    }
    toast('Pedido creado ✓', 'success')
    cerrarModal()
    await cargar()
  })


  // ── Editar Pedido ──────────────────────────────────
  window.editarPedido = (id) => {
    const pedido = pedidos.find(p => p.id === id)
    if (!pedido) return

    document.getElementById('modal-overlay').dataset.editingId = id // Guardar ID que editamos
    document.querySelector('.modal-title').textContent = 'Editar pedido'
    document.getElementById('f-cliente').value = pedido.cliente_id || ''
    document.getElementById('f-direccion').value = pedido.direccion_entrega || ''
    
    // 👇 ACÁ ESTÁ EL CAMBIO: Si no hay teléfono de entrega, busca el teléfono original del cliente
    document.getElementById('f-telefono').value = pedido.telefono_entrega || pedido.clientes?.telefono || ''
    
    document.getElementById('f-notas').value = pedido.notas || ''
    
    productosSeleccionados = pedido.productos_json ? [...pedido.productos_json] : []
    
    // Cambiamos el texto del botón
    document.getElementById('btn-guardar').textContent = 'Guardar pedido'
    
    renderProductosDisponibles()
    renderProductosSeleccionados()
    document.getElementById('modal-overlay').style.display = 'flex'
  }


 window.verDetallePedido = (id) => {
    const pedido = pedidos.find(p => p.id === id); 
    if (!pedido) return;

    const body = document.getElementById('detalle-pedido-body');
    const fecha = new Date(pedido.created_at).toLocaleDateString('es-AR', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
    
    let html = `
      <div style="margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border);">
        <div style="font-size:15px; font-weight:500; color:var(--text-primary); margin-bottom:4px;">👤 ${pedido.clientes?.nombre || 'S/N'}</div>
        <div style="font-size:13px; color:var(--text-muted);">📅 ${fecha} | 📍 ${pedido.direccion_entrega || 'Sin dirección'} | 💳 ${pedido.metodo_pago || 'A coordinar'}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">`;

    let subtotalCalculado = 0;

    if (pedido.productos_json && Array.isArray(pedido.productos_json)) {
      pedido.productos_json.forEach(prod => {
        const precioUnitario = Number(prod.precio || 0);
        const cantidad = Number(prod.cantidadPedida || prod.cantidad || 1);
        const subtotalItem = cantidad * precioUnitario;
        subtotalCalculado += subtotalItem;
        
        // Traemos imagen y stock fresco de la base de datos por si no estaban en el pedido viejo
        const prodFresco = productos.find(p => p.id === prod.id);
        const imagenSegura = prod.imagen_url || (prodFresco ? prodFresco.imagen_url : null);
        const stockSeguro = prodFresco ? prodFresco.stock : (prod.stock ?? '-');
        const contenidoSeguro = prod.contenido || prod.unidad || (prodFresco ? prodFresco.unidad : '-');

        const imagenHtml = imagenSegura 
          ? `<img src="${imagenSegura}" style="width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--border);" />` 
          : `<div style="width:48px; height:48px; background:var(--bg); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-muted); border:1px dashed var(--border);">Sin foto</div>`;

        html += `
          <div style="display:flex; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);">
            ${imagenHtml}
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
              <div style="font-weight:600; font-size:14px; color:var(--text-primary);">${prod.nombre || 'Producto'}</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
                📦 Stock: <strong style="color:var(--text-primary);">${stockSeguro}</strong> | 📏 Cont: ${contenidoSeguro}
              </div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">$${precioUnitario.toLocaleString('es-AR')} c/u</div>
            </div>
            <div style="text-align:right; display:flex; flex-direction:column; justify-content:center;">
              <div style="font-weight:700; color:var(--accent); font-size:14px;">x${cantidad}</div>
              <div style="font-size:13px; font-weight:600; margin-top:4px;">$${subtotalItem.toLocaleString('es-AR')}</div>
            </div>
          </div>`;
      });
    }

    html += `</div>`;

    if (pedido.notas) {
      html += `
        <div style="margin-top:16px; padding:12px; background:var(--surface); border-left:3px solid #eab308; border-radius:4px;">
          <div style="font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; margin-bottom:4px;">📝 Notas del Pedido</div>
          <div style="font-size:13px; color:var(--text-primary); font-style:italic;">${pedido.notas}</div>
        </div>
      `;
    }

    const totalFinal = Number(pedido.total || subtotalCalculado);
    const descuentoReal = Number(pedido.descuento || (subtotalCalculado > totalFinal ? subtotalCalculado - totalFinal : 0));

    html += `<div style="margin-top:20px; padding:16px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13px; color:var(--text-muted);">
          <span>Subtotal de productos:</span>
          <span style="font-weight:500;">$${subtotalCalculado.toLocaleString('es-AR')}</span>
        </div>`;

    // Lógica para detectar qué promoción es y ponerla en verde
    if (descuentoReal > 0) {
      let textoPromo = '';
      if (pedido.tipo_descuento === 'promocion-2x3') textoPromo = '<strong style="font-weight:700;">(Promo 2x3)</strong>';
      else if (pedido.tipo_descuento === 'promocion-3x4') textoPromo = '<strong style="font-weight:700;">(Promo 3x4)</strong>';
      else if (pedido.tipo_descuento === 'porcentaje-10') textoPromo = '<strong style="font-weight:700;">(10% OFF)</strong>';
      else if (pedido.tipo_descuento === 'porcentaje-20') textoPromo = '<strong style="font-weight:700;">(20% OFF)</strong>';
      else if (pedido.tipo_descuento === 'porcentaje-30') textoPromo = '<strong style="font-weight:700;">(30% OFF)</strong>';
      else if (pedido.tipo_descuento === 'porcentaje-custom') textoPromo = '<strong style="font-weight:700;">(Descuento %)</strong>';
      else if (pedido.tipo_descuento === 'fijo') textoPromo = '<strong style="font-weight:700;">(Monto fijo)</strong>';
      else if (pedido.tipo_descuento === 'promocion-custom') textoPromo = '<strong style="font-weight:700;">(Promo especial)</strong>';

      html += `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:13px; color:var(--accent);">
          <span>Descuento / Promo ${textoPromo}:</span>
          <span style="font-weight:600;">-$${descuentoReal.toLocaleString('es-AR')}</span>
        </div>`;
    }

    html += `
        <div style="display:flex; justify-content:space-between; align-items:center; padding-top:12px; border-top:1px dashed var(--border);">
          <span style="font-size:15px; font-weight:600; color:var(--text-primary);">Total Final:</span>
          <span style="font-size:24px; font-weight:800; color:var(--accent);">$${totalFinal.toLocaleString('es-AR')}</span>
        </div>
      </div>`;

    body.innerHTML = html;
    document.getElementById('modal-detalle-pedido').style.display = 'flex';
  }

window.cerrarModalDetalle = () => { document.getElementById('modal-detalle-pedido').style.display = 'none'; }


  
  // ── Eliminar ──────────────────────────────────────

  window.eliminarPedido = async (id) => {
    if (!await confirmar('¿Eliminar este pedido?', '¿Eliminar pedido?')) return
    const { error } = await supabase.from('pedidos').delete().eq('id', id)
    if (error) { toast('Error al eliminar.', 'error'); return }
    toast('Pedido eliminado')
    await cargar()
  }

  await cargar()
</script>

</body>
</html>
