<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlorandoSur — Inventario</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">

  <div style="display:flex; flex-direction:column; overflow:hidden;">

    <header class="topbar">
      <span class="page-title">Inventario</span>
      <div class="topbar-actions">
        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="search" type="text" class="form-control" placeholder="Buscar producto..." style="padding-left:34px; width:220px;" />
        </div>
        <button class="btn btn-primary" id="btn-nuevo">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo producto
        </button>
      </div>
    </header>

    <main class="main-content fade-up">

      <!-- ALERTAS DE BAJO STOCK -->
      <div id="alertas-stock" style="margin-bottom:24px;"></div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th style="width:100px;"></th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr>
              <td colspan="5" style="text-align:center; padding:32px; color:var(--text-muted);">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- Modal: nuevo/editar producto -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-titulo">Nuevo producto</span>
      <button class="btn-icon" id="btn-cerrar-modal">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="producto-id" />
      <div class="form-grid-2">
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Nombre del producto *</label>
          <input id="f-nombre" class="form-control" type="text" placeholder="Ej: Vaper Caliburn A2" />
        </div>
        <div class="form-group">
          <label class="form-label">Precio ($) *</label>
          <input id="f-precio" class="form-control" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label class="form-label">Stock actual *</label>
          <input id="f-stock" class="form-control" type="number" min="0" placeholder="0" />
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Categoría</label>
          <select id="f-categoria" class="form-control">
            <option value="">Sin categoría</option>
            <option value="vaporizadores">Vaporizadores</option>
            <option value="liquidos">Líquidos</option>
            <option value="pods">Pods</option>
            <option value="accesorios">Accesorios</option>
            <option value="resistencias">Resistencias</option>
            <option value="baterias">Baterías</option>
            <option value="otros">Otros</option>
          </select>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Descripción</label>
          <input id="f-descripcion" class="form-control" type="text" placeholder="Descripción opcional" />
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Imagen del producto</label>
          <div style="
            display: flex;
            flex-direction: column;
            gap: 8px;
          ">
            <input id="f-imagen" class="form-control" type="file" accept="image/*" />
            <div id="imagen-preview" style="
              display: none;
              width: 100%;
              height: 180px;
              background: var(--bg-secondary);
              border-radius: var(--radius-sm);
              overflow: hidden;
              border: 2px solid var(--border);
            ">
              <img id="imagen-preview-img" src="" alt="Preview" style="
                width: 100%;
                height: 100%;
                object-fit: contain;
                padding: 8px;
              " />
            </div>
            <div id="imagen-info" style="
              font-size: 12px;
              color: var(--text-muted);
              display: none;
            "></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancelar">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
  import { supabase, requiereAuth, getRol, toast } from '../js/supabase.js'
  import { renderSidebar } from '../js/sidebar.js'
  import { procesarYSubirImagen } from '../js/imagen.js'

  const user = await requiereAuth()
  renderSidebar('inventario', user)

  let productos = []
  let editandoId = null
  let imagenSeleccionada = null

  // ── Cargar productos ──────────────────────────────

  async function cargar() {
    const { data, error } = await supabase
      .from('productos')
      .select('*')
      .order('nombre')

    if (error) { toast('Error al cargar productos', 'error'); return }
    productos = data
    renderTabla(productos)
    mostrarAlertasStock(productos)
  }

  function renderTabla(lista) {
    const tbody = document.getElementById('tabla-body')
    if (!lista || lista.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <div class="empty-state-title">Sin productos</div>
              <div class="empty-state-sub">Agregá el primer producto con el botón "Nuevo producto".</div>
            </div>
          </td>
        </tr>`
      return
    }

    tbody.innerHTML = lista.map(p => {
      let stockBadge
      if (p.stock === 0)     stockBadge = `<span class="badge badge-red">Sin stock</span>`
      else if (p.stock <= 3) stockBadge = `<span class="badge badge-yellow">${p.stock} un.</span>`
      else                   stockBadge = `<span class="badge badge-green">${p.stock} un.</span>`

      return `
        <tr style="cursor: pointer; transition: background 0.2s;" onclick="irAlDetalle('${p.id}')" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background=''">
          <td>
            <div style="font-weight:500; line-height:1.3;">${p.nombre}</div>
            ${p.descripcion ? `<div class="td-muted" style="font-size:12px; margin-top:2px;">${p.descripcion}</div>` : ''}
          </td>
          <td class="td-muted">${p.categoria || '—'}</td>
          <td style="font-weight:500;">$${Number(p.precio).toLocaleString('es-AR')}</td>
          <td>${stockBadge}</td>
          <td onclick="event.stopPropagation();">
            <div style="display:flex; gap:4px; justify-content:flex-end;">
              <button class="btn-icon" title="Editar" onclick="editarProducto('${p.id}')">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
              </button>
              <button class="btn btn-danger btn-sm" onclick="eliminarProducto('${p.id}', '${p.nombre.replace(/'/g,"\\'")}')">Eliminar</button>
            </div>
          </td>
        </tr>`
    }).join('')
  }

  function mostrarAlertasStock(lista) {
    const alertasDiv = document.getElementById('alertas-stock')
    const productosConBajoStock = lista.filter(p => p.stock <= 3)
    
    if (productosConBajoStock.length === 0) {
      alertasDiv.innerHTML = ''
      return
    }

    const productosPorAlerta = productosConBajoStock.map(p => 
      `<span style="font-weight:500;">${p.nombre}</span> (${p.stock} un.)`
    ).join(' • ')

    alertasDiv.innerHTML = `
      <div style="
        background: var(--warning-light);
        border: 1px solid var(--warning);
        border-radius: var(--radius-lg);
        padding: 12px 16px;
        display: flex;
        align-items:center;
        gap: 12px;
        color: var(--text-primary);
        font-size: 14px;
      ">
        <span style="font-size:20px;">⚠️</span>
        <div>
          <strong>Bajo stock detectado:</strong>
          ${productosPorAlerta}
        </div>
      </div>
    `
  }

  // ── Búsqueda ──────────────────────────────────────

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase()
    const filtrados = productos.filter(p =>
      p.nombre.toLowerCase().includes(q) ||
      (p.categoria ?? '').toLowerCase().includes(q) ||
      (p.descripcion ?? '').toLowerCase().includes(q)
    )
    renderTabla(filtrados)
    mostrarAlertasStock(filtrados)
  })

  // ── Modal: abrir ──────────────────────────────────

  document.getElementById('btn-nuevo').addEventListener('click', () => abrirModal(null))

  function abrirModal(producto) {
    editandoId = producto?.id ?? null
    imagenSeleccionada = null
    document.getElementById('modal-titulo').textContent =
      editandoId ? 'Editar producto' : 'Nuevo producto'
    document.getElementById('f-nombre').value      = producto?.nombre ?? ''
    document.getElementById('f-precio').value      = producto?.precio ?? ''
    document.getElementById('f-stock').value       = producto?.stock ?? ''
    document.getElementById('f-categoria').value   = producto?.categoria ?? ''
    document.getElementById('f-descripcion').value = producto?.descripcion ?? ''
    document.getElementById('f-imagen').value      = ''
    document.getElementById('imagen-preview').style.display = 'none'
    document.getElementById('imagen-info').style.display = 'none'
    document.getElementById('modal-overlay').style.display = 'flex'
    document.getElementById('f-nombre').focus()
  }

  function cerrarModal() {
    document.getElementById('modal-overlay').style.display = 'none'
    editandoId = null
  }

  document.getElementById('btn-cerrar-modal').addEventListener('click', cerrarModal)
  document.getElementById('btn-cancelar').addEventListener('click', cerrarModal)

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) cerrarModal()
  })

  // ── Preview de imagen ──────────────────────────

  document.getElementById('f-imagen').addEventListener('change', async (e) => {
    const file = e.target.files[0]
    if (!file) {
      document.getElementById('imagen-preview').style.display = 'none'
      document.getElementById('imagen-info').style.display = 'none'
      return
    }

    // Mostrar preview
    const reader = new FileReader()
    reader.onload = (event) => {
      document.getElementById('imagen-preview-img').src = event.target.result
      document.getElementById('imagen-preview').style.display = 'block'
    }
    reader.readAsDataURL(file)

    // Guardar para usar al guardar
    imagenSeleccionada = file

    // Mostrar info
    const sizeMB = (file.size / 1024 / 1024).toFixed(2)
    document.getElementById('imagen-info').textContent = `${file.name} (${sizeMB}MB)`
    document.getElementById('imagen-info').style.display = 'block'
  })

  // ── Guardar ───────────────────────────────────────

  document.getElementById('btn-guardar').addEventListener('click', async () => {
    const nombre    = document.getElementById('f-nombre').value.trim()
    const precio    = parseFloat(document.getElementById('f-precio').value)
    const stock     = parseInt(document.getElementById('f-stock').value)
    const categoria = document.getElementById('f-categoria').value
    const desc      = document.getElementById('f-descripcion').value.trim()

    if (!nombre || isNaN(precio) || isNaN(stock)) {
      toast('Completá los campos obligatorios.', 'error')
      return
    }

    const btn = document.getElementById('btn-guardar')
    btn.textContent = 'Guardando...'
    btn.disabled = true

    try {
      let imagenUrl = null

      // Si hay imagen nueva, procesarla y subirla
      if (imagenSeleccionada) {
        btn.textContent = 'Optimizando imagen...'
        
        // Generar ID temporal si es producto nuevo
        const idParaImagen = editandoId || `temp-${Date.now()}`
        
        try {
          imagenUrl = await procesarYSubirImagen(imagenSeleccionada, idParaImagen, {
            maxWidth: 800,
            maxHeight: 800,
            quality: 0.85,
            maxSizeKB: 500
          })
        } catch (err) {
          toast(`Error al subir imagen: ${err.message}`, 'error')
          btn.textContent = 'Guardar'
          btn.disabled = false
          return
        }
      }

      const datos = {
        nombre,
        precio,
        stock,
        categoria: categoria || null,
        descripcion: desc || null,
        ...(imagenUrl && { imagen_url: imagenUrl })
      }

      btn.textContent = 'Guardando producto...'

      let error
      if (editandoId) {
        ;({ error } = await supabase.from('productos').update(datos).eq('id', editandoId))
      } else {
        ;({ error } = await supabase.from('productos').insert(datos))
      }

      btn.textContent = 'Guardar'
      btn.disabled = false

      if (error) { 
        toast('Error al guardar.', 'error')
        return 
      }

      toast(editandoId ? 'Producto actualizado ✓' : 'Producto agregado ✓', 'success')
      cerrarModal()
      await cargar()
      imagenSeleccionada = null
    } catch (err) {
      console.error(err)
      toast('Error inesperado', 'error')
      btn.textContent = 'Guardar'
      btn.disabled = false
    }
  })

  // ── Editar / Eliminar / Detalle (exponer globales) ────────

  window.editarProducto = (id) => {
    const p = productos.find(x => x.id === id)
    if (p) abrirModal(p)
  }

  window.eliminarProducto = async (id, nombre) => {
    if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return
    const { error } = await supabase.from('productos').delete().eq('id', id)
    if (error) { toast('Error al eliminar.', 'error'); return }
    toast('Producto eliminado', 'default')
    await cargar()
  }

  window.irAlDetalle = (id) => {
    window.location.href = `/pages/producto-detalle.html?id=${id}`
  }

  await cargar()
</script>

</body>
</html>
