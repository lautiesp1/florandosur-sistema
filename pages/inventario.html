<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlorandoSur — Inventario</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div style="display:flex; flex-direction:column; overflow:hidden;">

    <header class="topbar">
      <span class="page-title">Inventario</span>
      <div class="topbar-actions">
        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="search" type="text" class="form-control" placeholder="" style="padding-left:34px;" />
        </div>
        <button class="btn btn-primary" id="btn-nuevo">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo producto
        </button>
      </div>
    </header>

    <main class="main-content fade-up">
      <div id="alertas-stock" style="margin-bottom:24px;"></div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th style="width:100px;"></th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="5" style="text-align:center; padding:32px; color:var(--text-muted);">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-titulo">Nuevo producto</span>
      <button class="btn-icon" id="btn-cerrar-modal">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="producto-id" />
      <div class="form-grid-2">
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Nombre del producto *</label>
          <input id="f-nombre" class="form-control" type="text" />
        </div>
        <div class="form-group">
          <label class="form-label">Marca</label>
          <input id="f-marca" class="form-control" type="text" />
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label">Categoría</label>
          <select id="f-categoria" class="form-control" onchange="toggleNuevaCategoria()">
            <option value="">Seleccionar categoría...</option>
            <option value="NUEVA" style="font-weight:bold; color:var(--accent);">➕ Agregar nueva categoría...</option>
          </select>
          <input type="text" id="f-nueva-categoria" class="form-control" style="display:none; margin-top:8px;" placeholder="Ej: Semillas, Fertilizantes...">
        </div>
        <div class="form-group">
          <label class="form-label">Precio de Costo ($) *</label>
          <input id="f-precio-costo" class="form-control" type="number" step="0.01" />
        </div>
        <div class="form-group">
          <label class="form-label">Precio de Venta ($) *</label>
          <input id="f-precio-venta" class="form-control" type="number" step="0.01" />
        </div>
        <div class="form-group">
          <label class="form-label">Stock actual *</label>
          <input id="f-stock" class="form-control" type="number" />
        </div>

        <div class="form-group" style="grid-column: 1 / -1; background: var(--bg); padding: 16px; border-radius: 8px; border: 1px dashed var(--border); margin-top: 8px;">
          <label class="form-label" style="color: var(--accent); font-weight:600;">Detalles de Contenido</label>
          <div style="display: flex; gap: 12px;">
            <input id="f-cantidad" class="form-control" type="number" step="0.1" placeholder="" style="flex: 2;" />
            <select id="f-unidad" class="form-control" style="flex: 1;">
              <option value="ml">ml</option>
              <option value="gr">gr</option>
              <option value="unidad">unidad</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Genética (separado por comas)</label>
          <input id="f-genetica" class="form-control" type="text" placeholder="" />
        </div>
        <div class="form-group">
          <label class="form-label">Sabores (separado por comas)</label>
          <input id="f-sabor" class="form-control" type="text" placeholder="" />
        </div>

        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Descripción</label>
          <input id="f-descripcion" class="form-control" type="text" />
        </div>

        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Imagen del producto</label>
          <input id="f-imagen" class="form-control" type="file" accept="image/*" />
          <div id="imagen-preview" style="display:none; width:100%; height:180px; background:var(--bg-secondary); border-radius:8px; overflow:hidden; border:2px solid var(--border); margin-top:8px;">
            <img id="imagen-preview-img" alt="Preview" style="width:100%; height:100%; object-fit:contain; padding:8px;" />
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancelar">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
  import { supabase, requiereAuth, toast, confirmar } from '../js/supabase.js'
  import { renderSidebar } from '../js/sidebar.js'
  import { procesarYSubirImagen } from '../js/imagen.js'
  

  const user = await requiereAuth()
  await renderSidebar('inventario', user)

  let productos = [], editandoId = null, imagenSeleccionada = null

  async function cargar() {
    // Cambiamos el ordenamiento de 'nombre' a 'created_at' (descendente)
    const { data, error } = await supabase
      .from('productos')
      .select('*')
      .order('created_at', { ascending: false }) // 👈 Este es el cambio clave

    if (error) { toast('Error al cargar productos', 'error'); return }
    productos = data
    renderTabla(productos)
    
    // Mantenemos la función que armamos antes para las categorías
    actualizarSelectCategorias()
  }

  // 👇 ESTA ES LA FUNCIÓN NUEVA
  function actualizarSelectCategorias() {
    const select = document.getElementById('f-categoria');
    if (!select) return;

    // 1. Empezamos sin categorías base, que el usuario cree las suyas
    const base = [];
    
    // 2. Juntamos las base con las que ya están en tu base de datos
    const categoriasCrudas = [...base, ...productos.map(p => p.categoria).filter(Boolean)];
    
    // 3. Filtro inteligente para eliminar duplicados (ignora tildes y mayúsculas)
    const mapaCategorias = new Map();
    
    categoriasCrudas.forEach(cat => {
       // Convertimos "Líquidos" en "liquidos" solo para comparar si ya existe
       const catNormalizada = cat.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
       
       if (!mapaCategorias.has(catNormalizada)) {
           // Si no existe, la guardamos con la primera letra en mayúscula para que se vea linda
           const catLimpia = cat.trim();
           const catCapitalizada = catLimpia.charAt(0).toUpperCase() + catLimpia.slice(1);
           mapaCategorias.set(catNormalizada, catCapitalizada);
       }
    });

    // 4. Ordenamos alfabéticamente
    const todas = Array.from(mapaCategorias.values()).sort();

    // 5. Reconstruimos el menú desplegable
    let html = '<option value="">Sin categoría</option>';
    todas.forEach(cat => {
      html += `<option value="${cat}">${cat}</option>`;
    });
    
    html += '<option value="NUEVA" style="font-weight:bold; color:var(--accent);">➕ Agregar nueva categoría...</option>';
    select.innerHTML = html;
  }

  function renderTabla(lista) {
    const tbody = document.getElementById('tabla-body')

    // 👇 AGREGAMOS EL MENSAJE DE VACÍO AQUÍ 👇
    if (lista.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px; opacity: 0.5;"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
            <br>No hay productos cargados en el inventario.
          </td>
        </tr>
      `;
      return; // Frenamos la función para que no dibuje nada más
    }
    tbody.innerHTML = lista.map(p => `
      <tr onclick="irAlDetalle('${p.id}')" style="cursor:pointer;">
        <td><div style="font-weight:500;">${p.nombre}</div></td>
        <td class="td-muted">${p.categoria || '—'}</td>
        <td style="font-weight:500;">$${Number(p.precio_venta || 0).toLocaleString('es-AR')}</td>
        <td><span class="badge ${p.stock <= 3 ? 'badge-yellow' : 'badge-green'}">${p.stock} un.</span></td>
        <td onclick="event.stopPropagation();">
          <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn-icon" onclick="editarProducto('${p.id}')" title="Editar producto" style="font-size:16px;">✏️</button>
            <button class="btn-icon" onclick="eliminarProducto('${p.id}')" title="Eliminar producto" style="font-size:16px; color:var(--danger);">🗑️</button>
          </div>
        </td>
      </tr>`).join('')
  }

 

  function abrirModal(p) {
    editandoId = p?.id ?? null
    imagenSeleccionada = null
    document.getElementById('modal-titulo').textContent = editandoId ? 'Editar producto' : 'Nuevo producto'
    
    // Cargar todos los datos en el modal
    document.getElementById('f-nombre').value = p?.nombre ?? ''
    document.getElementById('f-marca').value = p?.marca ?? ''
    document.getElementById('f-categoria').value = p?.categoria ?? ''
    // 👇 Ocultamos el campo de nueva categoría al abrir el modal
    document.getElementById('f-nueva-categoria').style.display = 'none'
    document.getElementById('f-nueva-categoria').value = ''
    document.getElementById('f-precio-costo').value = p?.precio_costo ?? ''
    document.getElementById('f-precio-venta').value = p?.precio_venta ?? ''
    document.getElementById('f-stock').value = p?.stock ?? ''
    document.getElementById('f-cantidad').value = p?.cantidad ?? ''
    document.getElementById('f-unidad').value = p?.unidad ?? 'ml'
    document.getElementById('f-descripcion').value = p?.descripcion ?? ''
    document.getElementById('f-genetica').value = p?.genetica ? p.genetica.join(', ') : ''
    document.getElementById('f-sabor').value = p?.sabor ? p.sabor.join(', ') : ''
    document.getElementById('f-imagen').value = '' // Limpiar el input file
    
    const preview = document.getElementById('imagen-preview')
    const imgEl = document.getElementById('imagen-preview-img')
    if (p?.imagen_url) { imgEl.src = p.imagen_url; preview.style.display = 'block' }
    else { preview.style.display = 'none' }
    
    document.getElementById('modal-overlay').style.display = 'flex'
  }

  // ✅ EVENTO NUEVO PARA PREVISUALIZAR Y CAPTURAR LA FOTO
  document.getElementById('f-imagen').addEventListener('change', e => {
    imagenSeleccionada = e.target.files[0]
    if (imagenSeleccionada) {
      const reader = new FileReader()
      reader.onload = ev => {
        document.getElementById('imagen-preview-img').src = ev.target.result
        document.getElementById('imagen-preview').style.display = 'block'
      }
      reader.readAsDataURL(imagenSeleccionada)
    } else {
      document.getElementById('imagen-preview').style.display = 'none'
    }
  })


  

  // ✅ GUARDADO COMPLETO DE TODOS LOS DATOS
  document.getElementById('btn-guardar').addEventListener('click', async () => {
    const btn = document.getElementById('btn-guardar')
    btn.disabled = true; btn.textContent = 'Guardando...'

    try {
      let imagenUrl = null
      if (imagenSeleccionada) {
        imagenUrl = await procesarYSubirImagen(imagenSeleccionada, editandoId || `temp-${Date.now()}`)
      }

      // Procesar Genética y Sabor convirtiéndolos en arrays
      const geneticaVal = document.getElementById('f-genetica').value.trim()
      const saborVal = document.getElementById('f-sabor').value.trim()

      // 👇 AQUÍ INICIA EL CÓDIGO DEL PASO 3: Lógica de la categoría nueva
      let categoriaFinal = document.getElementById('f-categoria').value;
      if (categoriaFinal === 'NUEVA') {
        categoriaFinal = document.getElementById('f-nueva-categoria').value.trim();
        if (!categoriaFinal) {
          toast('Por favor, escribí el nombre de la nueva categoría', 'error');
          btn.disabled = false; btn.textContent = 'Guardar'; // Reactiva el botón
          return; // Frena el guardado
        }
      }
      // 👆 FIN DE LA LÓGICA DE CATEGORÍA

      const datos = {
        nombre: document.getElementById('f-nombre').value.trim(),
        marca: document.getElementById('f-marca').value.trim() || null,
        
        // 👇 Aquí usamos la variable que acabamos de crear
        categoria: categoriaFinal || null, 
        
        descripcion: document.getElementById('f-descripcion').value.trim() || null,
        precio_costo: parseFloat(document.getElementById('f-precio-costo').value) || 0,
        precio_venta: parseFloat(document.getElementById('f-precio-venta').value) || 0,
        stock: parseInt(document.getElementById('f-stock').value) || 0,
        cantidad: parseFloat(document.getElementById('f-cantidad').value) || null,
        unidad: document.getElementById('f-unidad').value,
        genetica: geneticaVal ? geneticaVal.split(',').map(s => s.trim()) : null,
        sabor: saborVal ? saborVal.split(',').map(s => s.trim()) : null,
        updated_at: new Date()
      }
      
      // Solo actualiza la imagen si subieron una nueva
      if (imagenUrl) datos.imagen_url = imagenUrl

      const { error } = editandoId 
        ? await supabase.from('productos').update(datos).eq('id', editandoId)
        : await supabase.from('productos').insert(datos)

      if (error) throw error

      toast('Se ha guardado correctamente ✓', 'success')
      sessionStorage.removeItem('cache_productos');
      cerrarModal(); await cargar()
    } catch (e) {
      console.error(e)
      toast('Error al guardar', 'error')
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar'
    }
  })

  function cerrarModal() { document.getElementById('modal-overlay').style.display = 'none'; editandoId = null }


  document.getElementById('btn-cerrar-modal').onclick = cerrarModal
  document.getElementById('btn-cancelar').onclick = cerrarModal
  document.getElementById('btn-nuevo').onclick = () => abrirModal(null)
  window.irAlDetalle = (id) => window.location.href = `producto-detalle.html?id=${id}`


    // Muestra el input de texto si el usuario elige "NUEVA"
  window.toggleNuevaCategoria = () => {
    const select = document.getElementById('f-categoria');
    const inputNueva = document.getElementById('f-nueva-categoria');
    if (select.value === 'NUEVA') {
      inputNueva.style.display = 'block';
      inputNueva.focus();
    } else {
      inputNueva.style.display = 'none';
      inputNueva.value = '';
    }
  }


   window.editarProducto = (id) => {
    const p = productos.find(x => x.id === id)
    if (p) abrirModal(p)
  }


  window.eliminarProducto = async (id) => {
    const p = productos.find(x => x.id === id);
    
    // ✅ Aquí usamos el modal que creamos, con fondo negro y estilizado
    const confirmado = await confirmar(`¿Eliminar producto "${p?.nombre || ''}"? Esta acción no se puede deshacer.`, '¿Eliminar producto?');
    if (!confirmado) return;
    
    const { error } = await supabase.from('productos').delete().eq('id', id);
    if (error) { toast('Error al eliminar el producto', 'error'); return; }
    
    toast('Producto eliminado', 'success');
    sessionStorage.removeItem('cache_productos');
    await cargar();
  }


  // ── Buscador de productos ────────────────────────
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase()
    
    // Filtra por nombre, categoría o marca
    const filtrados = productos.filter(p =>
      p.nombre.toLowerCase().includes(q) ||
      (p.categoria ?? '').toLowerCase().includes(q) ||
      (p.marca ?? '').toLowerCase().includes(q)
    )
    
    renderTabla(filtrados)
  })


  await cargar()
</script>
</body>
</html>
