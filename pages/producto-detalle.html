<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlorandoSur — Detalle Producto</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .producto-detalle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .producto-imagen-container {
      position: relative;
    }

    .producto-imagen {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      background: var(--border);
      border-radius: var(--radius-lg);
      border: 2px solid var(--border);
    }

    .producto-sin-imagen {
      width: 100%;
      height: 300px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 2px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .producto-info h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .producto-precio {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .producto-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .producto-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
    }

    .badge-categoria {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .badge-stock-disponible {
      background: #E8F5E9;
      color: #2E7D32;
    }

    .badge-stock-bajo {
      background: #FFF3E0;
      color: #E65100;
    }

    .badge-sin-stock {
      background: #FFEBEE;
      color: #C62828;
    }

    .producto-seccion {
      margin-bottom: 24px;
    }

    .producto-seccion-titulo {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .producto-seccion-contenido {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .producto-acciones {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .producto-acciones .btn {
      flex: 1;
      min-width: 140px;
    }

    @media (max-width: 768px) {
      .producto-detalle {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .producto-info h1 {
        font-size: 24px;
      }

      .producto-precio {
        font-size: 28px;
      }

      .producto-acciones {
        flex-direction: column;
      }

      .producto-acciones .btn {
        width: 100%;
        min-width: unset;
      }
      
      .producto-imagen {
        max-height: 350px;
      }
      
      .producto-sin-imagen {
        height: 200px;
      }
    }
    
    @media (max-width: 480px) {
      .producto-detalle {
        padding: 12px;
        gap: 16px;
      }
      
      .producto-info h1 {
        font-size: 20px;
        margin-bottom: 12px;
      }

      .producto-precio {
        font-size: 24px;
        margin-bottom: 12px;
      }
      
      .producto-badges {
        margin-bottom: 16px;
        gap: 6px;
      }
      
      .producto-badge {
        padding: 4px 10px;
        font-size: 12px;
      }
      
      .producto-seccion {
        margin-bottom: 16px;
      }
      
      .producto-seccion-titulo {
        font-size: 12px;
        margin-bottom: 6px;
      }
      
      .producto-seccion-contenido {
        font-size: 14px;
      }
      
      .producto-imagen {
        max-height: 280px;
        border-radius: 10px;
      }
      
      .producto-sin-imagen {
        height: 160px;
        border-radius: 10px;
      }
    }
    /* Estilos para que los datos se vean como tabla */
    .specs-container {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }
    .spec-item {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .spec-item:last-child {
      border-bottom: none;
    }
    .spec-label {
      width: 130px;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 13px;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .spec-value {
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      flex: 1;
    }
    .costo-tag {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <div style="display:flex; flex-direction:column; overflow:hidden;">

    <header class="topbar">
      <span class="page-title" id="topbar-titulo">Detalle Producto</span>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-volver">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
          Volver
        </button>
      </div>
    </header>

    <main class="main-content fade-up">
      <div id="contenedor-detalle">
        <div style="text-align: center; padding: 40px;">
          <div class="spinner" style="margin: 0 auto; margin-bottom: 16px;"></div>
          <p class="text-muted">Cargando producto...</p>
        </div>
      </div>
    </main>

  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
  import { supabase, requiereAuth, toast } from '../js/supabase.js'
  import { renderSidebar } from '../js/sidebar.js'

  const user = await requiereAuth()
  renderSidebar('inventario', user)

  // Obtener ID del producto desde URL
  const params = new URLSearchParams(window.location.search)
  const productoId = params.get('id')

  if (!productoId) {
    document.getElementById('contenedor-detalle').innerHTML = `
      <div style="text-align: center; padding: 40px;">
        <p style="color: var(--text-muted);">⚠️ Producto no encontrado</p>
      </div>
    `
  } else {
    cargarProducto()
  }

  document.getElementById('btn-volver').addEventListener('click', () => {
    history.back()
  })

  async function cargarProducto() {
    const { data: producto, error } = await supabase
      .from('productos')
      .select('*')
      .eq('id', productoId)
      .single()

    if (error || !producto) {
      document.getElementById('contenedor-detalle').innerHTML = `
        <div style="text-align: center; padding: 40px;">
          <p style="color: var(--text-muted);">⚠️ Error al cargar el producto</p>
        </div>
      `
      return
    }

    renderDetalleProducto(producto)
  }

 function renderDetalleProducto(p) {
  const badgeStock = p.stock === 0 
    ? `<span class="badge badge-red">Sin stock</span>`
    : (p.stock <= 3 ? `<span class="badge badge-yellow">Bajo stock (${p.stock} un.)</span>` : `<span class="badge badge-green">Disponible (${p.stock} un.)</span>`);

  // Manejo de imagen
  const imagenHTML = p.imagen_url
    ? `<img src="${p.imagen_url}" alt="${p.nombre}" class="producto-imagen" />`
    : `<div class="producto-sin-imagen"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Sin imagen</span></div>`;

  // Procesar arrays de genética y sabor
  const geneticaHTML = p.genetica && p.genetica.length > 0 
    ? `<div class="producto-seccion">
        <div class="producto-seccion-titulo">Genética</div>
        <div class="producto-seccion-contenido">${p.genetica.join(', ')}</div>
      </div>` 
    : '';

  const saborHTML = p.sabor && p.sabor.length > 0 
    ? `<div class="producto-seccion">
        <div class="producto-seccion-titulo">Sabores</div>
        <div class="producto-seccion-contenido">${p.sabor.join(', ')}</div>
      </div>` 
    : '';

  // Inyectar HTML actualizado en el contenedor
  document.getElementById('contenedor-detalle').innerHTML = `
    <div class="producto-detalle">
      <div class="producto-imagen-container">
        ${imagenHTML}
      </div>
      <div class="producto-info">
        <h1 style="margin-bottom: 16px;">${p.nombre}</h1>
        
        <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 24px;">
          <div class="producto-precio" style="margin-bottom: 0;">$${Number(p.precio_venta).toLocaleString('es-AR')}</div>
          <div class="costo-tag">Costo: $${Number(p.precio_costo).toLocaleString('es-AR')}</div>
        </div>
        
        <div style="margin-bottom: 24px;">${badgeStock}</div>

        <div class="specs-container">
          ${p.descripcion ? `<div class="spec-item"><span class="spec-label">Descripción</span><span class="spec-value" style="font-weight:500;">${p.descripcion}</span></div>` : ''}
          <div class="spec-item"><span class="spec-label">Marca</span><span class="spec-value">${p.marca || '—'}</span></div>
          <div class="spec-item"><span class="spec-label">Contenido</span><span class="spec-value">${p.cantidad ? p.cantidad + ' ' + (p.unidad || '') : '—'}</span></div>
          <div class="spec-item"><span class="spec-label">Genética</span><span class="spec-value">${(p.genetica && p.genetica.length > 0) ? p.genetica.join(', ') : '—'}</span></div>
          <div class="spec-item"><span class="spec-label">Sabores</span><span class="spec-value">${(p.sabor && p.sabor.length > 0) ? p.sabor.join(', ') : '—'}</span></div>
          <div class="spec-item"><span class="spec-label">Categoría</span><span class="spec-value">${p.categoria || '—'}</span></div>
        </div>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
