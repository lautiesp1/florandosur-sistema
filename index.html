<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlorandoSur — Ingresar</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card fade-up">

    <img src="logo.png" alt="FlorandoSur" class="login-logo-img" />
    <p class="login-subtitle">Sistema de gestión</p>

    <div id="login-error" class="login-error"></div>

    <div class="form-group">
      <label class="form-label" for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        class="form-control"
        placeholder=""
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        class="form-control"
        placeholder=""
        autocomplete="current-password"
      />
    </div>

    <button id="btn-login" class="btn btn-primary w-full" style="margin-top:8px; justify-content:center; height:42px;">
      Ingresar
    </button>

    <div class="login-options">
      <label class="login-checkbox">
        <input type="checkbox" id="keep-session" />
        <span>Mantener sesión</span>
      </label>
    </div>

  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase.js';


  const btnLogin = document.getElementById('btn-login')
  const emailInput = document.getElementById('email')
  const passInput  = document.getElementById('password')
  const errorBox   = document.getElementById('login-error')
  const keepSessionCheckbox = document.getElementById('keep-session')

  // Restaurar credenciales guardadas si "Mantener sesión" estaba activo
  const savedEmail = localStorage.getItem('florandosur_email')
  const savedKeepSession = localStorage.getItem('florandosur_keep_session') === 'true'
  
  if (savedKeepSession && savedEmail) {
    emailInput.value = savedEmail
    keepSessionCheckbox.checked = true
  }

  // Si ya está logueado, redirigir
  supabase.auth.getSession().then(async ({ data: { session } }) => {
    if (session) {
      // Leemos el rol real de la tabla profiles
      const { data: perfil } = await supabase.from('profiles').select('rol').eq('id', session.user.id).single()
      const rol = perfil?.rol || 'delivery'
      
      if (rol === 'admin') {
        window.location.href = 'pages/dashboard.html'
      } else {
        window.location.href = 'pages/pedidos.html'
      }
    }
  }).catch(err => {
    console.error('Error verificando sesión:', err)
  })

  btnLogin.addEventListener('click', async () => {
    const email    = emailInput.value.trim()
    const password = passInput.value

    if (!email || !password) {
      mostrarError('Completá los dos campos.')
      return
    }

    btnLogin.textContent = 'Ingresando...'
    btnLogin.disabled = true
    errorBox.style.display = 'none'

    const { data, error } = await supabase.auth.signInWithPassword({ email, password })

    if (error) {
      mostrarError('Email o contraseña incorrectos.')
      btnLogin.textContent = 'Ingresar'
      btnLogin.disabled = false
      return
    }

    // Guardar preferencia de "Mantener sesión"
    if (keepSessionCheckbox.checked) {
      localStorage.setItem('florandosur_email', email)
      localStorage.setItem('florandosur_keep_session', 'true')
    } else {
      localStorage.removeItem('florandosur_email')
      localStorage.removeItem('florandosur_keep_session')
    }

    redirigir(data.user)
  })

  // Enter para login
  passInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') btnLogin.click()
  })

  async function redirigir(user) {
    try {
      // Consultamos el rol real en la tabla profiles usando el ID del usuario
      const { data: perfil, error } = await supabase
        .from('profiles')
        .select('rol')
        .eq('id', user.id)
        .single()

      if (error) {
        console.error('Error al obtener perfil:', error)
        window.location.href = 'pages/dashboard.html' // Backup por si falla
        return
      }

      const rol = perfil?.rol

      // Redirección basada en el dato real de la tabla
      if (rol === 'admin') {
        window.location.href = 'pages/dashboard.html'
      } else if (rol === 'delivery') {
        window.location.href = 'pages/pedidos.html'
      } else {
        window.location.href = 'pages/dashboard.html'
      }
    } catch (err) {
      console.error('Error crítico en redirección:', err)
      window.location.href = 'pages/dashboard.html'
    }
  }

  function mostrarError(msg) {
    errorBox.textContent = msg
    errorBox.style.display = 'block'
  }
</script>

</body>
</html>
